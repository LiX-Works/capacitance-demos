name: Verify and publish Capacitance Demos

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build both demos with the bundled compiler
        run: npm run build
      - name: Check types, data, release contracts and regressions
        run: npm run check && npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: python -m pip install -r requirements-qa.txt
      - name: Verify failed scientific stages do not overwrite released data
        run: npm run test:safety
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test real URLs, both demos and project subpaths
        run: npm run qa
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the collection website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the collection
        id: deployment
        uses: actions/deploy-pages@v4
